name: Deploy to Aliyun OSS

# 触发：push 到 main、手动点 Run workflow、或每小时自动跑（飞书改了自动上线）
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync from Feishu -> data.js
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
        run: python3 sync_feishu.py

      - name: Install ossutil
        run: curl -L https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash

      - name: Upload to OSS (含 images/ 整体同步)
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        run: |
          ossutil64 config -e "$OSS_ENDPOINT" -i "$ALIYUN_ACCESS_KEY_ID" -k "$ALIYUN_ACCESS_KEY_SECRET" -c "$HOME/.ossutilconfig"
          ossutil64 sync . "oss://$OSS_BUCKET/" \
            --exclude '.git/*' \
            --exclude '.github/*' \
            --update \
            -c "$HOME/.ossutilconfig"
          echo "✅ 已同步到 OSS，访问你的域名即可"
